<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Experience Survey</title>
</head>
<body>
    <header>
        <h1>User Experience Survey</h1>
        <p>Please fill out the form below to help us improve our services.</p>
    </header>
    <main>
        <form action="#" method="POST">
            <section>
                <h2>User Information</h2>
                <div>
                    <label for="full-name">Full Name:</label>
                    <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required>
                </div>
                <br>
                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
            </section>
            <br>
            <section>
                <h2>Experience Rating</h2>
                <p>How satisfied are you with our service?</p>
                <div>
                    <input type="radio" id="very-satisfied" name="satisfaction" value="very_satisfied" required>
                    <label for="very-satisfied">Very Satisfied</label>
                </div>
                <div>
                    <input type="radio" id="satisfied" name="satisfaction" value="satisfied">
                    <label for="satisfied">Satisfied</label>
                </div>
                <div>
                    <input type="radio" id="neutral" name="satisfaction" value="neutral">
                    <label for="neutral">Neutral</label>
                </div>
                <div>
                    <input type="radio" id="dissatisfied" name="satisfaction" value="dissatisfied">
                    <label for="dissatisfied">Dissatisfied</label>
                </div>
            </section>
            <br>
            <section>
                <h2>Valued Features</h2>
                <p>What features do you value most? (Select all that apply)</p>
                <div>
                    <input type="checkbox" id="feature-ui" name="features" value="user_interface">
                    <label for="feature-ui">Clean User Interface</label>
                </div>
                <div>
                    <input type="checkbox" id="feature-speed" name="features" value="performance_speed">
                    <label for="feature-speed">Fast Performance and Speed</label>
                </div>
                <div>
                    <input type="checkbox" id="feature-support" name="features" value="customer_support">
                    <label for="feature-support">Responsive Customer Support</label>
                </div>
                <div>
                    <input type="checkbox" id="feature-pricing" name="features" value="affordable_pricing">
                    <label for="feature-pricing">Affordable Pricing</label>
                </div>
            </section>
            <br>
            <section>
                <h2>User Role</h2>
                <div>
                    <label for="user-role">What best describes you?</label>
                    <select id="user-role" name="user_role" required>
                        <option value="" disabled selected>-- Select your role --</option>
                        <option value="student">Student</option>
                        <option value="professional">Professional</option>
                        <option value="hobbyist">Hobbyist</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </section>
            <br>
            <section>
                <h2>Additional Comments</h2>
                <div>
                    <label for="comments">Additional comments or suggestions?</label><br>
                    <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Share your thoughts here..."></textarea>
                </div>
            </section>
            <br>
            <div>
                <button type="submit">Submit Survey</button>
            </div>
        </form>
    </main>
</body>
</html>
